<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HELENA OS v6.1 - SNES Core Supreme Sync</title>
    
    <!-- BIBLIOTECA FIREBASE (COMPAT) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0f172a;
            --cyan-glow: #06b6d4;
            --yellow-jose: #fde047;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            z-index: 9999;
            background-size: 100% 4px;
            pointer-events: none;
        }

        #emulator-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000;
        }

        #emulator-container {
            width: 100%;
            height: 100%;
        }

        .menu-container, .controller-container, div[id*="control"], div[class*="control"], div[class*="touch"], .settings-menu {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        
        .top-buttons-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }

        .sys-btn {
            background: rgba(2, 6, 23, 0.85);
            border: 2px solid var(--yellow-jose);
            color: var(--yellow-jose);
            padding: 8px 14px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.3);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .sys-btn:hover {
            background: var(--yellow-jose);
            color: #000;
        }

        #config-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: var(--bg-secondary);
            border: 2px solid var(--cyan-glow);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            padding: 20px;
            z-index: 10000;
            display: none;
            border-radius: 4px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: var(--yellow-jose);
            font-size: 1rem;
            font-weight: bold;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        #boot-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary);
            z-index: 20000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--cyan-glow);
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(6, 182, 212, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border-left-color: var(--cyan-glow);
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="boot-overlay">
        <div class="spinner" id="boot-spinner"></div>
        <h2 style="color: var(--yellow-jose); letter-spacing: 2px; margin-bottom: 10px; font-size: 1.2rem;">HELENA INDUSTRIAL OS</h2>
        <p id="boot-text" style="font-size: 0.75rem; color: var(--text-muted);">Iniciando motor e carregando ROM...</p>
    </div>

    <div class="top-buttons-container">
        <button id="btn-save" class="sys-btn" onclick="manualSaveState()">💾 Salvar</button>
        <button id="btn-config" class="sys-btn">⚙️ Info</button>
    </div>

    <div id="emulator-background">
        <div id="emulator-container"></div>
    </div>

    <div id="config-modal">
        <div class="modal-header">
            <span class="modal-title">HELENA OS v6.1</span>
            <button class="btn-close" onclick="toggleModal()">&times;</button>
        </div>
        <div class="input-group">
            <label>STATUS DA NUVEM JDP</label>
            <p style="color: var(--cyan-glow); font-size: 0.85rem;" id="cloud-status-text">Conectado ao Firebase</p>
            <span style="font-size: 0.65rem; color: var(--text-muted);">O progresso é salvo na nuvem automaticamente.</span>
        </div>
    </div>

    <script>
        const LOJA_ID = "LEOVARDIOS_burguer_2026";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCEdXF7ScnMYz0Ce0OW-B_UJ8Bm5Pl9m8o",
            databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const bootOverlay = document.getElementById('boot-overlay');
        const bootText = document.getElementById('boot-text');
        const bootSpinner = document.getElementById('boot-spinner');
        const configModal = document.getElementById('config-modal');
        const btnConfig = document.getElementById('btn-config');

        btnConfig.addEventListener('click', toggleModal);
        function toggleModal() {
            configModal.style.display = configModal.style.display === 'block' ? 'none' : 'block';
        }

        const urlParams = new URLSearchParams(window.location.search);
        let userWhatsApp = urlParams.get('u') || localStorage.getItem('jdp_cliente_whatsapp') || "convidado_industrial";

        // 1. FUNÇÃO AUTOMÁTICA DE UPLOAD (Salva na Nuvem do Firebase)
        function autoSalvarProgressoNaNuves() {
            if (!userWhatsApp || userWhatsApp === "convidado_industrial") return;

            if (window.EJS_emulator && typeof window.EJS_emulator.getSaveState === 'function') {
                window.EJS_emulator.getSaveState((state) => {
                    db.ref(`lojas/${LOJA_ID}/usuarios/${userWhatsApp}/estado_emulador`).set({
                        dados: state,
                        timestamp: Date.now()
                    }).then(() => {
                        console.log("[JDP SYNC] Progresso sincronizado automaticamente com a nuvem.");
                    }).catch(err => {
                        console.error("[JDP SYNC] Erro ao sincronizar:", err);
                    });
                });
            }
        }

        // 2. FUNÇÃO AUTOMÁTICA DE DOWNLOAD (Puxa da Nuvem do Firebase ao iniciar)
        function autoCarregarProgressoDaNuvem(callback) {
            if (!userWhatsApp || userWhatsApp === "convidado_industrial") {
                if (callback) callback(null);
                return;
            }

            db.ref(`lojas/${LOJA_ID}/usuarios/${userWhatsApp}/estado_emulador`).once('value', snap => {
                if (snap.exists()) {
                    const registro = snap.val();
                    console.log("[JDP SYNC] Dados encontrados na nuvem. Restaurando fase...");
                    if (callback) callback(registro.dados);
                } else {
                    console.log("[JDP SYNC] Nenhum save anterior encontrado. Iniciando novo jogo.");
                    if (callback) callback(null);
                }
            });
        }

        function manualSaveState() {
            if (window.EJS_emulator && typeof window.EJS_emulator.getSaveState === 'function') {
                window.EJS_emulator.getSaveState((state) => {
                    db.ref(`lojas/${LOJA_ID}/usuarios/${userWhatsApp}/estado_emulador`).set({
                        dados: state,
                        timestamp: Date.now()
                    });
                    alert("Progresso salvo com sucesso na nuvem JDP!");
                });
            } else {
                alert("O emulador ainda está inicializando. Aguarde um instante.");
            }
        }

        // 3. GATILHOS AUTOMÁTICOS DE EXECUÇÃO
        // A. Salvar automaticamente a cada 30 segundos de gameplay
        setInterval(() => {
            autoSalvarProgressoNaNuves();
        }, 30000);

        // B. Salvar automaticamente ao fechar ou sair da página
        window.addEventListener('beforeunload', () => {
            autoSalvarProgressoNaNuves();
        });

        window.addEventListener('DOMContentLoaded', () => {
            bootText.innerText = "Inicializando EmulatorJS...";

            window.EJS_player = '#emulator-container';
            window.EJS_gameUrl = 'mario.smc'; 
            window.EJS_core = 'snes9x';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;
            window.EJS_disableControls = true;
            
            window.EJS_webGL = true;
            window.EJS_currentShader = 'disabled';
            window.EJS_sampleRate = 44100;

            window.EJS_onGameStart = function() {
                bootOverlay.style.display = 'none';
                
                // PUXA OS DADOS DO FIREBASE AUTOMATICAMENTE AO ABRIR
                autoCarregarProgressoDaNuvem((dadosSalvos) => {
                    if (dadosSalvos && window.EJS_emulator && typeof window.EJS_emulator.loadSaveState === 'function') {
                        try {
                            window.EJS_emulator.loadSaveState(dadosSalvos);
                            console.log("Fase anterior carregada com sucesso do Firebase!");
                        } catch(e) {
                            console.error("Erro ao aplicar o save da nuvem:", e);
                        }
                    }
                });

                setInterval(() => {
                    document.querySelectorAll('.menu-container, .controller-container, div[class*="control"], div[class*="touch"]').forEach(el => el.remove());
                }, 500);
            };

            const loaderScript = document.createElement('script');
            loaderScript.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(loaderScript);
        });
    </script>
</body>
</html>
