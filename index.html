<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HELENA OS v6.1 - SNES Core Supreme Sync</title>
    
    <!-- BIBLIOTECA FIREBASE (COMPAT) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0f172a;
            --cyan-glow: #06b6d4;
            --yellow-jose: #fde047;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Efeito de scanline retro */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 9999;
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* CONTAINER DO EMULADOR */
        #emulator-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000;
        }

        #emulator-container {
            width: 100%;
            height: 100%;
        }

        /* OCULTAR QUALQUER CONTROLE NATIVO DO EMULATORJS */
        .menu-container, .controller-container, div[id*="control"], div[class*="control"], div[class*="touch"], .settings-menu {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        
        /* BOTÕES DO TOPO */
        .top-buttons-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }

        .sys-btn {
            background: rgba(2, 6, 23, 0.8);
            border: 2px solid var(--yellow-jose);
            color: var(--yellow-jose);
            padding: 8px 14px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.3);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .sys-btn:hover {
            background: var(--yellow-jose);
            color: #000;
        }

        /* PAINEL MODAL */
        #config-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: var(--bg-secondary);
            border: 2px solid var(--cyan-glow);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            padding: 20px;
            z-index: 10000;
            display: none;
            border-radius: 4px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: var(--yellow-jose);
            font-size: 1rem;
            font-weight: bold;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        /* BOOT OVERLAY */
        #boot-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary);
            z-index: 20000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--cyan-glow);
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(6, 182, 212, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border-left-color: var(--cyan-glow);
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- BOOT INICIAL DA HELENA -->
    <div id="boot-overlay">
        <div class="spinner" id="boot-spinner"></div>
        <h2 style="color: var(--yellow-jose); letter-spacing: 2px; margin-bottom: 10px; font-size: 1.2rem;">HELENA INDUSTRIAL OS</h2>
        <p id="boot-text" style="font-size: 0.75rem; color: var(--text-muted);">Sincronizando sessão e carregando ROM...</p>
    </div>

    <!-- BOTÕES NO TOPO -->
    <div class="top-buttons-container">
        <button id="btn-save" class="sys-btn" onclick="manualSaveState()">💾 Salvar</button>
        <button id="btn-config" class="sys-btn">⚙️ Info</button>
    </div>

    <!-- EMULADOR -->
    <div id="emulator-background">
        <div id="emulator-container"></div>
    </div>

    <!-- PAINEL MODAL -->
    <div id="config-modal">
        <div class="modal-header">
            <span class="modal-title">HELENA OS v6.1</span>
            <button class="btn-close" onclick="toggleModal()">&times;</button>
        </div>
        <div class="input-group">
            <label>STATUS DA NUVEM JDP</label>
            <p style="color: var(--cyan-glow); font-size: 0.85rem;" id="cloud-status-text">Conectado ao Firebase</p>
            <span style="font-size: 0.65rem; color: var(--text-muted);">O progresso é salvo na nuvem automaticamente para que você nunca perca sua sessão ao sair.</span>
        </div>
    </div>

    <!-- SCRIPT DE GERENCIAMENTO E FIREBASE -->
    <script>
        const LOJA_ID = "LEOVARDIOS_burguer_2026";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCEdXF7ScnMYz0Ce0OW-B_UJ8Bm5Pl9m8o",
            databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const bootOverlay = document.getElementById('boot-overlay');
        const bootText = document.getElementById('boot-text');
        const bootSpinner = document.getElementById('boot-spinner');
        const configModal = document.getElementById('config-modal');
        const btnConfig = document.getElementById('btn-config');

        btnConfig.addEventListener('click', toggleModal);
        function toggleModal() {
            configModal.style.display = configModal.style.display === 'block' ? 'none' : 'block';
        }

        // Recupera o WhatsApp do usuário logado via URL ou localStorage
        const urlParams = new URLSearchParams(window.location.search);
        let userWhatsApp = urlParams.get('u') || localStorage.getItem('jdp_cliente_whatsapp') || "convidado_industrial";

        // Funções de Persistência no Firebase
        function salvarEstadoEmulador(dadosEstado) {
            if (!userWhatsApp) return;
            db.ref(`lojas/${LOJA_ID}/usuarios/${userWhatsApp}/estado_emulador`).set({
                dados: dadosEstado,
                timestamp: Date.now()
            }).then(() => {
                console.log("Estado do emulador salvo com sucesso no Firebase!");
            });
        }

        function carregarEstadoEmulador(callback) {
            if (!userWhatsApp) {
                if (callback) callback(null);
                return;
            }
            db.ref(`lojas/${LOJA_ID}/usuarios/${userWhatsApp}/estado_emulador`).once('value', snap => {
                if (snap.exists()) {
                    const estadoSalvo = snap.val();
                    console.log("Estado recuperado do Firebase:", estadoSalvo);
                    if (callback) callback(estadoSalvo.dados);
                } else {
                    if (callback) callback(null);
                }
            });
        }

        function manualSaveState() {
            if (window.EJS_emulator && typeof window.EJS_emulator.getSaveState === 'function') {
                window.EJS_emulator.getSaveState((state) => {
                    salvarEstadoEmulador(state);
                    alert("Progresso salvo com sucesso na nuvem JDP!");
                });
            } else {
                // Salvamento de estado simulado/fallback caso o core ainda esteja iniciando
                salvarEstadoEmulador({ status: "ativo", time: Date.now() });
                alert("Sessão registrada com sucesso na nuvem JDP!");
            }
        }

        // Salvamento automático a cada 30 segundos
        setInterval(() => {
            if (window.EJS_emulator && typeof window.EJS_emulator.getSaveState === 'function') {
                window.EJS_emulator.getSaveState((state) => {
                    salvarEstadoEmulador(state);
                });
            }
        }, 30000);

        // Salvar automaticamente ao fechar ou sair da página
        window.addEventListener('beforeunload', () => {
            if (window.EJS_emulator && typeof window.EJS_emulator.getSaveState === 'function') {
                window.EJS_emulator.getSaveState((state) => {
                    salvarEstadoEmulador(state);
                });
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const romFileName = "mario.smc";

            fetch(romFileName)
                .then(response => {
                    if (!response.ok) throw new Error("Arquivo 'mario.smc' não encontrado!");
                    return response.blob();
                })
                .then(blob => {
                    bootText.innerText = "ROM carregada! Restaurando sessão do Firebase...";
                    const romUrl = URL.createObjectURL(blob);

                    window.EJS_player = '#emulator-container';
                    window.EJS_biosUrl = ''; 
                    window.EJS_gameUrl = romUrl; 
                    window.EJS_core = 'snes';
                    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                    window.EJS_startOnLoaded = true;
                    window.EJS_disableControls = true;

                    window.EJS_onGameStart = function() {
                        bootOverlay.style.display = 'none';
                        
                        // Tenta carregar o estado salvo anteriormente do Firebase
                        carregarEstadoEmulador((dados) => {
                            if (dados && window.EJS_emulator && typeof window.EJS_emulator.loadSaveState === 'function') {
                                try {
                                    window.EJS_emulator.loadSaveState(dados);
                                    console.log("Estado anterior restaurado com sucesso!");
                                } catch(e) {
                                    console.error("Erro ao aplicar estado salvo:", e);
                                }
                            }
                        });

                        // Remove menus excedentes do core
                        setInterval(() => {
                            document.querySelectorAll('.menu-container, .controller-container, div[class*="control"], div[class*="touch"]').forEach(el => el.remove());
                        }, 200);
                    };

                    const loaderScript = document.createElement('script');
                    loaderScript.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                    document.body.appendChild(loaderScript);
                })
                .catch(err => {
                    bootSpinner.style.display = 'none';
                    bootText.innerHTML = `<span style="color: #ef4444;">ERRO: ${err.message}</span>`;
                });
        });
    </script>
</body>
</html>
